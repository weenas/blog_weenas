<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <title id="title">家庭旁路由分流拓扑</title>
  <desc id="desc">测试设备把默认网关和 DNS 指向 NAS 上的虚拟 OpenWrt（sing-box，10.1.1.2）。直连流量经主路由（10.1.1.1）访问互联网；代理流量同样经过主路由，通过 Hysteria2 隧道到达 VPS，再由 VPS 访问互联网。</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrow-direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-proxy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0866ff"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#ffffff"/>

  <!-- Links (drawn first so nodes sit on top) -->
  <path d="M240 265 H322" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M600 245 H672" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#arrow-direct)"/>
  <path d="M600 285 H672" fill="none" stroke="#0866ff" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrow-proxy)"/>
  <path d="M890 245 C 930 245, 930 110, 962 110" fill="none" stroke="#0d9488" stroke-width="4" marker-end="url(#arrow-direct)"/>
  <path d="M890 285 C 930 285, 930 420, 962 420" fill="none" stroke="#0866ff" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrow-proxy)"/>
  <path d="M1065 372 V160" fill="none" stroke="#0866ff" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrow-proxy)"/>

  <!-- Nodes -->
  <g text-anchor="middle" fill="#061b3c">
    <rect x="40" y="205" width="200" height="120" rx="18" fill="#f6f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="140" y="257" font-size="24" font-weight="700">测试设备</text>
    <text x="140" y="291" font-size="16" fill="#475569">网关 / DNS → 10.1.1.2</text>

    <rect x="330" y="175" width="270" height="180" rx="18" fill="#eef4ff" stroke="#0866ff" stroke-width="2.5"/>
    <text x="465" y="226" font-size="24" font-weight="700">旁路由</text>
    <text x="465" y="262" font-size="17" fill="#334155">NAS 虚拟机 · OpenWrt</text>
    <text x="465" y="292" font-size="17" fill="#334155">sing-box 分流</text>
    <text x="465" y="324" font-size="16" fill="#475569">10.1.1.2</text>

    <rect x="680" y="205" width="210" height="120" rx="18" fill="#f6f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="785" y="257" font-size="24" font-weight="700">主路由</text>
    <text x="785" y="291" font-size="16" fill="#475569">10.1.1.1 · 唯一上游</text>

    <rect x="970" y="60" width="190" height="100" rx="18" fill="#f6f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1065" y="119" font-size="24" font-weight="700">互联网</text>

    <rect x="970" y="372" width="190" height="100" rx="18" fill="#f6f7fb" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1065" y="414" font-size="24" font-weight="700">VPS</text>
    <text x="1065" y="446" font-size="16" fill="#475569">Hysteria2 服务端</text>
  </g>

  <!-- Path labels -->
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="852" y="150" width="104" height="30" rx="15" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
    <text x="904" y="171" fill="#0f766e">直连</text>
    <rect x="818" y="350" width="140" height="30" rx="15" fill="#eef4ff" stroke="#0866ff" stroke-width="1.5"/>
    <text x="888" y="371" fill="#0552d6">Hysteria2 隧道</text>
  </g>

  <!-- Legend -->
  <g font-size="17" fill="#334155">
    <path d="M60 500 H120" stroke="#0d9488" stroke-width="4"/>
    <text x="134" y="506">直连：国内和局域网流量，经主路由访问互联网</text>
    <path d="M620 500 H680" stroke="#0866ff" stroke-width="4" stroke-dasharray="12 8"/>
    <text x="694" y="506">代理：经主路由进入隧道，由 VPS 访问互联网</text>
  </g>
</svg>
